name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Application
        run: |
          npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk android-sdk-platform-tools android-sdk-build-tools

      - name: Install Android Components
        run: |
          export ANDROID_SDK_ROOT=/usr/lib/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin
          
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 || true
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses 2>&1 || true

      - name: Initialize Capacitor Android Project
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            python3 - "$MANIFEST" <<'PY'
          import sys
          from pathlib import Path

          manifest_path = Path(sys.argv[1])
          content = manifest_path.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
          ]

          additions = []
          for permission in permissions:
              declaration = f'    <uses-permission android:name="{permission}" />'
              if declaration not in content:
                  additions.append(declaration)

          if additions:
              marker = "</manifest>"
              content = content.replace(marker, "\n".join(additions) + "\n" + marker, 1)
              manifest_path.write_text(content)
          PY
          fi

      - name: Build Android Debug APK
        env:
          ANDROID_SDK_ROOT: /usr/lib/android-sdk
          ANDROID_HOME: /usr/lib/android-sdk
          GRADLE_OPTS: -Xmx2048m -XX:MaxPermSize=512m
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew --version
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon --info

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MV-Director-AI-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
