name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk android-sdk-platform-tools android-sdk-build-tools

      - name: Install Android Components
        run: |
          export ANDROID_SDK_ROOT=/usr/lib/android-sdk
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 || true
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses 2>&1 || true

      - name: Check for Android Project
        run: |
          if [ ! -d "android" ]; then
            echo "Android directory not found. You need to add an Android project to your repo."
            echo "Option 1: Commit an android/ folder with a complete Android project"
            echo "Option 2: Use Capacitor (requires package.json setup)"
            exit 1
          fi

      - name: Build Android Debug APK
        env:
          ANDROID_SDK_ROOT: /usr/lib/android-sdk
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MV-Director-AI-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
