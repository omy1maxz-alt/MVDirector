name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK (via apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk
          
      - name: Configure Android SDK Paths
        run: |
          echo "ANDROID_SDK_ROOT=/usr/lib/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/lib/android-sdk" >> $GITHUB_ENV
          echo "/usr/lib/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --sdk_root=/usr/lib/android-sdk --licenses 2>&1 || true

      - name: Install Required SDK Components
        run: |
          sdkmanager --sdk_root=/usr/lib/android-sdk "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 || true

      - name: Initialize Capacitor Android (if needed)
        run: |
          if [ ! -d "android" ]; then
            npm install @capacitor/cli @capacitor/core @capacitor/android
            npx cap init "mv-director" "com.mvdirector.studio"
            npx cap add android
          fi
          npm install @capacitor/cli @capacitor/core @capacitor/android
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MV-Director-AI-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30
